# Push a tag like v1.2.3 to build, test, sign and publish telly.apk as a GitHub Release.
# The "latest" download link (https://github.com/tellyteam/telly-android/releases/latest/download/telly.apk)
# then always serves the newest version, which is what the Downloader code points at.
#
# Actions are pinned to exact commits: this job holds the signing key, and a moved tag must not be
# able to run new code next to it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Restore the signing key
        env:
          TELLY_KEYSTORE_BASE64: ${{ secrets.TELLY_KEYSTORE_BASE64 }}
        run: |
          test -n "$TELLY_KEYSTORE_BASE64" || { echo "TELLY_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$TELLY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/telly-release.jks"

      - name: Test and build
        env:
          TELLY_KEYSTORE_PATH: ${{ runner.temp }}/telly-release.jks
          TELLY_KEYSTORE_PASSWORD: ${{ secrets.TELLY_KEYSTORE_PASSWORD }}
          TELLY_KEY_ALIAS: telly
          TELLY_KEY_PASSWORD: ${{ secrets.TELLY_KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease -PtellyVersion=${GITHUB_REF_NAME}

      - name: Check the APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs "$APK" | head -3
          cp "$APK" telly.apk

      # Release notes come from the tag's own message (git tag -a v1.2.3 -m "…"), never GitHub's
      # generated notes: those credit people by account name, and telly shows the notes in the app.
      - name: Release notes from the tag
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' > "$RUNNER_TEMP/notes.md"
          # A lightweight tag has no message; its "contents" is the commit's, which isn't release notes.
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ] || : > "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: telly.apk
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: false

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/telly-release.jks"
